
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMMS Learning Portal</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#6a11cb,#2575fc,#00c6ff);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;
  background: white;
  padding: 30px 24px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 12px 35px #0003;
}

.logo {
  font-size: 55px;
}

h1 {
  color: #6a11cb;
  font-size: 28px;
  margin-bottom: 8px;
}

.subtitle {
  color: #555;
  line-height: 1.6;
}

.login {
  display: block;
  padding: 18px;
  margin-top: 22px;
  border-radius: 14px;
  color: white;
  text-decoration: none;
  font-size: 19px;
  font-weight: bold;
}

.student {
  background: linear-gradient(90deg,#7b2ff7,#4c6fff);
}

.teacher {
  background: linear-gradient(90deg,#11998e,#38ef7d);
}

.login:hover {
  transform: scale(1.02);
}

footer {
  margin-top: 28px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

  <div class="logo">📚</div>

  <h1>NMMS LEARNING PORTAL</h1>

  <p class="subtitle">
    வரவேற்கிறோம்!<br>
    NMMS MAT & SAT கற்றல் இணையதளம்
  </p>

  <a href="student-login.html" class="login student">
    🎓 STUDENT LOGIN<br>
    <small>மாணவர் உள்நுழைவு</small>
  </a>

  <a href="teacher-login.html" class="login teacher">
    👨‍🏫 TEACHER LOGIN<br>
    <small>ஆசிரியர் உள்நுழைவு</small>
  </a>

  <footer>
    தமிழ் மற்றும் ஆங்கில வழிக் கற்றல்
  </footer>

</div>
</body>
</html>
