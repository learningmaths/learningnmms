
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Login - NMMS</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 20px;
  display: flex; justify-content: center; align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
}
.card {
  width: 100%; max-width: 420px; background: white;
  padding: 28px; border-radius: 20px; text-align: center;
  box-shadow: 0 10px 30px #0003;
}
h1 { color: #6a11cb; }
input {
  width: 100%; padding: 14px; margin: 10px 0;
  border: 1px solid #ccc; border-radius: 10px;
  font-size: 16px;
}
button {
  width: 100%; padding: 14px; margin-top: 15px;
  background: #6a11cb; color: white; border: 0;
  border-radius: 10px; font-size: 18px; cursor: pointer;
}
#message { margin-top: 15px; line-height: 1.6; }
a { color: #6a11cb; }
</style>
</head>
<body>
<div class="card">
  <h1>🎓 Student Login</h1>
  <p>மாணவர் உள்நுழைவு</p>

  <form id="loginForm">
    <input id="studentId" type="text"
      placeholder="Student ID (உதா: 8A001)"
      autocomplete="username" required>

    <input id="password" type="password"
      placeholder="Password" autocomplete="current-password"
      required>

    <button type="submit">Login / உள்நுழைக</button>
  </form>

  <p id="message" aria-live="polite"></p>
  <p><a href="index.html">முகப்புப் பக்கத்திற்குச் செல்ல</a></p>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWGqHPlEN0XhnDGoCeImWbR_e7W3aKsQ",
  authDomain: "learning-maths-cc1fe.firebaseapp.com",
  projectId: "learning-maths-cc1fe",
  storageBucket: "learning-maths-cc1fe.firebasestorage.app",
  messagingSenderId: "577761460955",
  appId: "1:577761460955:web:76ca50a764f905862742fe",
  measurementId: "G-KP391PKX3R"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const studentId = document.getElementById("studentId")
    .value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  if (!/^[a-z0-9]+$/.test(studentId)) {
    message.textContent = "சரியான Student ID உள்ளிடவும்.";
    return;
  }

  message.textContent = "உள்நுழைகிறது...";

  try {
    const email = studentId + "@nmms.example.com";

    const credential = await signInWithEmailAndPassword(
      auth, email, password
    );

    const userDoc = await getDoc(
      doc(db, "users", credential.user.uid)
    );

    if (!userDoc.exists() || userDoc.data().role !== "student") {
      await signOut(auth);
      message.textContent = "இந்தக் கணக்கு மாணவர் கணக்கு அல்ல.";
      return;
    }

    message.textContent =
      "வணக்கம் " + userDoc.data().name +
      "! உள்நுழைவு வெற்றிகரமாக முடிந்தது.";

  } catch (error) {
    console.error(error);
    message.textContent =
      "பிழை குறியீடு: " + error.code +
      " | " + error.message;
}
});
</script>
</body>
</html>
